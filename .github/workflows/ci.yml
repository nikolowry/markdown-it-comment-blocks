#  =====================================================================
#  CI
#  =====================================================================
#  Every push to main and every pull request: the tests on each Node
#  release the package claims, against the markdown-it the lockfile
#  pins and again against 14.3.3, the oldest the peer range allows.
#  The peer range is a promise; this is what keeps it.
#
#  Actions are pinned to full commit SHAs.

name: ci

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node: [22, 24, 26]

        steps:
            #  actions/checkout v7.0.1
            - name: Check out
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            #  actions/setup-node v7.1.0
            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: ${{ matrix.node }}

            - name: Install
              run: npm ci

            - name: Test
              run: npm test

            - name: Test against markdown-it 14.3.3
              run: >-
                  npm install --no-save markdown-it@14.3.3 &&
                  npm test
